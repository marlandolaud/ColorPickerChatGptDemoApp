services:
  mcp-server-1:
    build: .
    environment:
      ASPNETCORE_URLS: http://+:5000
    networks:
      - mcp-net
    restart: unless-stopped

  mcp-server-2:
    build: .
    environment:
      ASPNETCORE_URLS: http://+:5000
    networks:
      - mcp-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mcp-server-1
      - mcp-server-2
    networks:
      - mcp-net
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: http nginx:80
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    networks:
      - mcp-net
    depends_on:
      - nginx
    restart: unless-stopped

  terraform:
    build:
      context: .
      dockerfile: Dockerfile.terraform
    volumes:
      - ./terraform:/workspace
      - ${HOME}/.azure:/root/.azure
    profiles:
      - tools

networks:
  mcp-net:
    driver: bridge
